<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta DNI - Tiketprint</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-top: 0;
      color: #1a365d;
      font-size: 22px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #4a5568;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }

    input[readonly] {
      background-color: #edf2f7;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007791;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #005a6e;
    }

    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Paciente Nuevo</h2>

    <!-- Entrada de DNI -->
    <div class="form-group">
      <label for="dniInput">Ingrese su número de DNI:</label>
      <input type="text" id="dniInput" placeholder="Ej: 19260615" maxlength="8">
    </div>

    <!-- Botón de consulta -->
    <div class="form-group">
      <button id="btnConsultar" onclick="consultarRENIEC()">⌛ Consultando RENIEC...</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

    <!-- Campos autocompletados -->
    <div class="form-group">
      <label for="nombres">Nombres:</label>
      <input type="text" id="nombres" placeholder="Nombres del paciente">
    </div>

    <div class="form-group">
      <label for="apellidoPaterno">Apellido Paterno:</label>
      <input type="text" id="apellidoPaterno" placeholder="Apellido paterno">
    </div>

    <div class="form-group">
      <label for="apellidoMaterno">Apellido Materno:</label>
      <input type="text" id="apellidoMaterno" placeholder="Apellido materno">
    </div>
  </div>

  <script>
    // URL Web App de Google Apps Script configurada
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxdlFsiBnAVLFhQVkxsCxiiXgZ_DdTotbEr7PhjG5pvjSR3bw7a4gKDtzP5ZwA8kfjZ/exec";

    async function consultarRENIEC() {
      const dniInput = document.getElementById("dniInput").value.trim();
      const btn = document.getElementById("btnConsultar");

      // Validar longitud del DNI
      if (dniInput.length !== 8 || isNaN(dniInput)) {
        alert("Por favor, ingrese un número de DNI válido de 8 dígitos.");
        return;
      }

      // Cambiar estado visual del botón durante la carga
      btn.innerText = "⏳ Consultando RENIEC...";
      btn.disabled = true;

      try {
        // Petición al Web App
        const response = await fetch(`${WEB_APP_URL}?dni=${dniInput}`);
        const data = await response.json();

        if (data.dni) {
          // Asignar los datos recibidos a los inputs correspondientes
          document.getElementById("nombres").value = data.nombres || "";
          document.getElementById("apellidoPaterno").value = data.apellidoPaterno || "";
          document.getElementById("apellidoMaterno").value = data.apellidoMaterno || "";
        } else {
          alert("⚠️ DNI no encontrado en RENIEC o límite de consultas consumido. Ingrese los datos manualmente.");
        }
      } catch (error) {
        console.error("Error en la solicitud:", error);
        alert("Error de conexión al consultar el servicio. Ingrese los datos manualmente.");
      } finally {
        // Restaurar estado del botón
        btn.innerText = "🔍 Consultar RENIEC";
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
